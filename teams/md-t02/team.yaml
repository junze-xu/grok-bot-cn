id: md-t02
name: 一稿多发组（自媒体 + 设计）
lead: md-c06
bots:
  - md-c06
  - md-c18
  - md-s01
  - md-s02
  - md-c21
why: >
  一份定稿或一条录好的视频丢进来，组长分派：同时出公众号草稿、小红书图文、封面和短视频切片，最后排进本周发布表。
group_kickoff: >
  @发布排期 收到定稿或视频后建立本周发布表并分派。@公众号一条龙 把定稿改成公众号排版草稿。
  @小红书图文 出小红书图文。@封面 出封面图。@切片 把视频切成短视频切片。不发布任何内容。
plugins:
  - GitHub
max_bots: 6
autonomy: L1
