id: podcast-desk
name: 口播编辑部（自媒体）
lead: topic-miner
bots:
  - topic-miner
  - tutorial-scriptwriter
  - spark-to-script
  - hook-rewriter
  - script-doctor
  - de-ai-polish
why: >
  五棒接力把「没题材」变成能直接录的定稿：选题、成稿、钩子、体检、去 AI 味，每棒停下来等主人说「过」。
group_kickoff: >
  @口播选题 跟我聊最近的经历、踩坑与想法，挖出 3 个带核心观点和目标观众的选题。@录屏教程编剧
  按我选中的选题出正文、台词与分镜。@开头钩子 写 3 个不同类型的开头。@口播体检 按啰嗦、断档、拗口三类体检。
  @去 AI 味 按发布场景定稿。每一棒完成都停下等我说「过」。
plugins:
  - GitHub
max_bots: 6
autonomy: L1
