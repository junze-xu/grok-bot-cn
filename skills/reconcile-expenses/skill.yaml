id: reconcile-expenses
name: 对账费用
when_to_use: >
  一周的费用要对照收据和政策，产出例外草稿——总额必须能回对到来源。
inputs:
  - 费用系统导出或连接器
  - 财务收件箱/附带收据
  - 书面报销政策（已签署的，不是记忆）
sequence:
  - 先对来源系统求总额；这个数是分母。
  - 对收据；缺类目和政策例外都要带政策引用标出。
  - 每位负责人起草一条跟进；不发送。
  - 返回汇总、例外、草稿、以及可对账的总额。
validate: >
  汇总总额等于来源系统总额或有解释的差额；每条例外都引用政策章节。
returns: >
  周汇总、带政策引用的例外表、未发送的跟进草稿、操作日志。
approval: >
  不要发送跟进；不要修改报销记录；也不要批准任何支出。
owners:
  - expense-manager
