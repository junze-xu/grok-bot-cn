id: interrogate-assumptions
name: 审问假设
when_to_use: >
  主人（或一份简报）把说法当事实，这些说法需要分成有来源、推断、无根据，
  别人在行动之前先看清。
inputs:
  - 问题、简报、备忘录或「已知」事实清单
  - 主人认为已经能定案的指定来源
  - 范围限制（日期、域名、不可用来源）
sequence:
  - 把每条说法改写成一个可检验的句子；不要把措辞强化得超过主人的原意。
  - 问：这条要是事实，什么必须成立？点名缺失的测量、一手来源或日期。
  - 只搜指定来源加范围内官方或一手页面；任何数字照引，不转述。
  - 每条标注：sourced（URL）、inferred（据何推断）、contested（两来源分歧）或 unfounded（找不到来源）。
  - 列出主人没说出口的承重假设。
validate: >
  每条说法都有标签；无根据项不被升级为有来源；分歧照引不平均；未找到清单非空，除非每条都有主来源 URL。
returns: >
  假设地图：说法、标签、证据或缺口、什么能证伪它、哪些决策应等待；查询操作日志。
approval: >
  不要联系人去「确认」；不要发布地图；不要把无来源统计当事实呈现。
owners:
  - source-interrogator
