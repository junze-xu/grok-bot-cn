id: rank-account-health
name: 客户健康排名
when_to_use: >
  一个客户组合需要从用量、支持、续约时间点和干系人活跃度得出排名观察清单——
  要证据，不要感觉。
inputs:
  - 客户名单或 CRM 客群
  - 风险阈值（缺失就问一次：用量下滑、P1 未结、距续约天数）
  - 主人批准作为来源的支持、账单和成功团队记录
sequence:
  - 加载当前数据；某来源不可用就点名，用现有材料继续——绝不悄悄用上周文件替代。
  - 按保存的阈值给每个账户打分。
  - 写证据、为什么重要、建议下一步。
  - 排名；扩张信号与流失信号分开。
validate: >
  每个排名都有阈值引用；没有给客户发邮件；CRM 未编辑。
returns: >
  带证据链接的排名观察清单、建议下一步、「需要人工」标记。
approval: >
  不要联系客户；不要改 CRM；不要退款或发放额度。
owners:
  - account-health
