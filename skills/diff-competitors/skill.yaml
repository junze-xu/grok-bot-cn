id: diff-competitors
name: 竞品差异对比
when_to_use: >
  一小组竞品需要被快照，只浮现实质变化——价格、变更日志、招聘、话术。
inputs:
  - 指定竞品（3–8 个）
  - /workspace 中上次快照（如存在）
  - 「实质」的定义（价格、打包、定位、指定岗位招聘，除非主人重新定义）
sequence:
  - 加载上次快照；没有就先取基线，写完即停。
  - 抓取当前公开页面；数字照引，不要转述。
  - 做差异；未变化的属性保持安静。
  - 写实质变化备忘，附 URL 和日期。
validate: >
  每个变化都有前后对比和 URL；没有「他们似乎正聚焦于」这类含糊话。
returns: >
  基线或差异备忘。未变化的竞品合并成一行，让主人知道它们被检查过。
approval: >
  不要抓取主人未授权的登录后页面；不要把备忘发到 Slack 或 X。
owners:
  - competitor-watch
