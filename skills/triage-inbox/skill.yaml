id: triage-inbox
name: 收件箱分类
when_to_use: >
  收件箱需要一份排好序的工作清单和草稿回复，让主人不必住在 Gmail 里也能归零。
inputs:
  - Gmail（或指定邮箱）连接器
  - VIP 名单和忽略名单（如主人保存过）
  - 时间窗口（默认上次运行以来）
sequence:
  - 取窗口内的消息；未经要求不要标记已读。
  - 分成需回复、仅供参考、通讯刊物、收据或忽略。
  - 只对需回复起草回复；有示例就用主人语气。
  - 标记任何像账单、法务截止或安全警报的邮件。
validate: >
  没有发出任何邮件；未经明确批准没有归档/删除；安全样邮件绝不自动忽略。
returns: >
  分桶清单，需回复项附草稿回复；以及「今日处理」Top 5。
approval: >
  未经批准不要发送、删除或退订；刊物退订属 L2+，单列。
owners:
  - inbox-triage
