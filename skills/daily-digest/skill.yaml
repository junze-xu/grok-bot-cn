id: daily-digest
name: 每日摘要
when_to_use: >
  主人要一份映射到既定优先事项、带来源链接的「变了什么、该关注什么」摘要，
  而不是把所有频道倾倒一遍。
inputs:
  - 优先事项文档或钉住的当前优先清单
  - 已批准的频道（Slack、邮件、日历、笔记）
  - 时间窗口（默认 Bot 时区的昨日起）
sequence:
  - 重读优先事项文档；缺失就询问后停止。
  - 只扫描窗口内的已批准来源。
  - 丢掉无法映射到任何优先项的内容。
  - 每条保留项写清来源、为什么重要、建议下一步、以及主人是否欠一个决策。
validate: >
  每条都有来源链接或消息指针；主人标记过的噪音不出现；没有发送消息，没有改会议。
returns: >
  一份短摘要加「需要决策」小节；以及扫描过的来源操作日志。
approval: >
  未经主人明确批准，不要发送消息、不要改动会议时间、也不要创建工单。
owners:
  - chief-of-staff
