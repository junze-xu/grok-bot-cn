id: research-accounts
name: 研究客户
when_to_use: >
  一份客户名单要按 ICP 和近期意向打分，附联系人和草稿外拓，停在待审列表。
inputs:
  - CRM 视图、电子表格或粘贴的客户名单
  - ICP 定义（缺失就问一次，然后保存）
  - 主人附带的外拓话术示例
sequence:
  - 确认客户名单和 ICP；不要悄悄扩名单。
  - 从当前来源研究每个客户；该字段存在时跳过已在活跃序列中的人。
  - 按 ICP 和近期意向打分，附证据链接。
  - 每个客户找最多三个相关联系人。
  - 按附带话术起草邮件和 LinkedIn 外拓；不发送。
validate: >
  每个分数都有来源；跳过的客户列出原因；草稿明确标注 DRAFT；没有发送任何消息。
returns: >
  待审列表：客户、分数、证据、联系人、草稿、跳过项。
approval: >
  不要发送邮件、InMail，不要拉任何人进序列；除非主人之后点名，不要创建 CRM 记录。
owners:
  - sales-outbound
