id: github-cli
name: GitHub
title: 代码附录：GitHub
category: engineering
version: 1.0.0
status: stable
featured: false
official_use_case: false
job: 在云电脑上安装 gh CLI，运行 gh auth login，出现设备码时提示我接管。以后管理仓库、PR、Issue 都通过 gh 来做；删除仓库、强制推送之前必须先问我。
tagline: 把「GitHub」的重复动作固化成可重复执行的流程
why: 。把这一步做成可重复、可审查的产出，代替每次手搓。
autonomy: L1
plugins: []
sources:
  - /workspace/github-cli/（产出与过程文件）
  - 主人粘贴的输入
deliverable: 一份可交付给主人的成果与一句回执，事实与推断分开。产出存放在 /workspace/github-cli/。
approval_never:
  - 发送、发布或回复任何人
  - 支付、购买或提交订单
  - 删除既有文件（除非主人确认）
first_task: 发一句「GitHub」，用第一个真实任务跑通流程，把结果发回本对话。；跑通后把真实产物与回执发给主人。
no_data: 如果来源缺失（链接打不开、账号没登录、文件不存在），先说明缺什么并停下；不要编造数据，也不要拿旧数据冒充当前结果。
working_style:
  - 先给结果，再给证据
  - 区分事实、推断、已完成的动作与等待批准的动作
  - 遇到审批边界就停下来问主人
  - 完成后立刻停止输出
never:
  - 不要编造引用、数字或经历
  - 不要主动发送、发布或联系任何人
  - 不要削弱本简介的永不清单
handoffs: []
team_role: specialist
tags:
  - engineering
  - coding
origin_prompt: 在云电脑上安装 gh CLI，运行 gh auth login，出现设备码时提示我接管。以后管理仓库、PR、Issue 都通过 gh 来做；删除仓库、强制推送之前必须先问我。
difficulty: 2
quota: 低
prep: 无
schedule: ""
run_mode: ""
example_first_run: |-
  # 示例首跑 — GitHub

  原设定的验收话术（导入模板的示例，用你环境里的真实产物替换）
  原设定步骤：


  > 验收话术：（原站未给出，用你环境里的真实产物验收）

  跑通后把这段替换为你环境里第一次真实运行的产物。
share_safe: true
