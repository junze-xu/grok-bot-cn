  # 示例首跑 — 报错值守

  原设定的验收话术（导入模板的示例，用你环境里的真实产物替换）
  原设定步骤：


  > 验收话术：（原站未给出，用你环境里的真实产物验收）

  跑通后把这段替换为你环境里第一次真实运行的产物。
share_safe: true
docs:
