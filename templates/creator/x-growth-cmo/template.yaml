  原设定步骤：


  原设定提醒：
  1. 它不会替你发帖，发布按钮永远是你自己按。
  2. 读不到的数据它会直接说读不到，不会编。要是看到它报了具体数字却没给链接，就追问一句它是从哪里看到的。
  3. 盯对标、出周报都要读 X，比较耗额度。对标账号别放太多，周报一周一次就够了。
  4. 它起草的帖子必须基于你亲自试过的经历。没有经历的话题，它会先问你，不会硬写。

