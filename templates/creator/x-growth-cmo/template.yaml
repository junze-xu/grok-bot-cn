tagline: 替你管 X 账号的营销：定周目标、排内容日历、盯对标、给帖子打分、每周出复盘
why: 替你管 X 账号的营销：定周目标、排内容日历、盯对标、给帖子打分、每周出复盘把这一步做成可重复、可审查的产出，代替每次手搓。
