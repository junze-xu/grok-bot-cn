  # 示例首跑 — 评论 FAQ

  来源站点的验收话术（导入模板的示例，用你环境里的真实产物替换）
  原设定步骤：
  定时任务按通用 B 确认。

  原设定提醒：
  faq.md 也可以给 C24 课程答疑 Bot 用。

  > 验收话术：发「现在汇总一次」→ 收到 FAQ 和选题建议。

  跑通后把这段替换为你环境里第一次真实运行的产物。
