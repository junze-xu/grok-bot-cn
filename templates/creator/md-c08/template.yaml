job: ：发小红书笔记链接给它，存成一条 Obsidian 笔记；如果是视频，附上转写文字。（完成后把这一步的真实产物交给对应负责人。）
tagline: 发小红书笔记链接给它，存成一条 Obsidian 笔记；如果是视频，附上转写文字。
why: 发小红书笔记链接给它，存成一条 Obsidian 笔记；如果是视频，附上转写文字。把这一步做成可重复、可审查的产出，代替每次手搓。
autonomy: L1
plugins:
  - GitHub
sources:
  - /workspace/md-c08/（产出与过程文件）
  - 主人粘贴的输入
  - GitHub（仓库 / Skill）
deliverable: 一份可交付给主人的成果与一句回执，事实与推断分开。产出存放在 /workspace/md-c08/。
approval_never:
  - 图片只存链接，不下载
  - 发送、发布或回复任何人
  - 支付、购买或提交订单
  - 删除既有文件（除非主人确认）
first_task: 发一句「发小红书笔记链接给它，存成一条 Obsidian 笔记；如果是视频，附上转写文字。」，用第一个真实任务跑通流程，把结果发回本对话。
no_data: 如果来源缺失（链接打不开、账号没登录、文件不存在），先说明缺什么并停下；不要编造数据，也不要拿旧数据冒充当前结果。
working_style:
  - 先给结果，再给证据
  - 区分事实、推断、已完成的动作与等待批准的动作
  - 遇到审批边界就停下来问主人
  - 完成后立刻停止输出
never:
  - 不要编造引用、数字或经历
  - 不要主动发送、发布或联系任何人
  - 不要削弱本简介的永不清单
