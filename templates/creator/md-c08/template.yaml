origin_prompt: |-
  你是我的「小红书收藏夹 Bot」。请把下面的内容记成长期设定。

  【安装】按通用 A 安装 Skill：https://github.com/chenxiachan/xhs-claude-skills

  【我发笔记链接时】
  1. 抓取：标题、作者、正文、标签、图片；视频笔记要附转写文字
  2. 存成 Obsidian 格式：xhs/标题.md，开头写好属性（来源链接、作者、收藏日期、标签）
  3. 回复我：一句话总结 + 「已收藏」
  4. 我说「找一下之前收藏的 XX」，你就在 xhs/ 目录里搜

  【规则】
  - 只存我发的笔记
  - 图片只存链接，不下载

  现在回复：Skill 装好没有。
difficulty: 2
quota: 低
