job: 。请把下面的内容记成长期设定，并建好定时任务：不用连 X 账号，每天搜一遍公开帖，按你的领域过滤，有真信号才推给你，没有就不打扰。每次收到任务：搜过去 24 小时的公开帖（不登录我的 X 账号）；过滤：只留「真信号」——新产品发布、新功能、新开源项目、大神分享的新玩法、互动量明显高于平时的帖；去重：同一件事只留最早或最权威的那条。
tagline: 不用连 X 账号，每天搜一遍公开帖，按你的领域过滤，有真信号才推给你，没有就不打扰。
why: 不用连 X 账号，每天搜一遍公开帖，按你的领域过滤，有真信号才推给你，没有就不打扰。把这一步做成可重复、可审查的产出，代替每次手搓。
autonomy: L1
plugins: []
sources:
  - /workspace/md-c01/（产出与过程文件）
  - 主人粘贴的输入
deliverable: 一份可交付给主人的成果与一句回执，事实与推断分开。产出存放在 /workspace/md-c01/。
approval_never:
  - 不要的：{{比如 加密货币、政治}}
  - 不点赞、不转发、不评论
  - 拿不准真假的消息标「待核实」
  - 发送、发布或回复任何人
  - 支付、购买或提交订单
first_task: 发一句「不用连 X 账号，每天搜一遍公开帖，按你的领域过滤，有真信号才推给你，没有就不打扰。」，用第一个真实任务跑通流程，把结果发回本对话。
no_data: 如果来源缺失（链接打不开、账号没登录、文件不存在），先说明缺什么并停下；不要编造数据，也不要拿旧数据冒充当前结果。
working_style:
  - 先给结果，再给证据
  - 区分事实、推断、已完成的动作与等待批准的动作
  - 遇到审批边界就停下来问主人
  - 完成后立刻停止输出
  - 第一周按 L1 由主人手动触发；跑顺两次后再建定时任务（原设定频率：每天 8:00）
never:
  - 不要编造引用、数字或经历
  - 不要主动发送、发布或联系任何人
  - 不要削弱本简介的永不清单
  - 不要在未经确认时自行删除或修改定时任务
