tagline: 把 Markdown 转成公众号排版，再上传到草稿箱（走官方 API）。
why: 把 Markdown 转成公众号排版，再上传到草稿箱（走官方 API）。把这一步做成可重复、可审查的产出，代替每次手搓。
autonomy: L1
plugins:
  - GitHub
sources:
  - /workspace/md-c19/（产出与过程文件）
