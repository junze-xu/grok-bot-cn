  # 示例首跑 — 个人选题

  来源站点的验收话术（导入模板的示例，用你环境里的真实产物替换）
  原设定步骤：
  先把 C12～C16 也建好，才能接力。推荐再拉进「T01 口播编辑部」群一起跑。

  原设定提醒：
  仓库 cheat-on-content（7.4k⭐），作者蜗牛学长。

  > 验收话术：发「找选题」→ 它开始问你问题，最后给出 3 个选题。

  跑通后把这段替换为你环境里第一次真实运行的产物。
share_safe: true
docs:
