first_task: 发一句「接上钉钉官方 MCP，Bot 能查通讯录、读写你的待办和日程，还能用机器人发消息。」，用第一个真实任务跑通流程，把结果发回本对话。
no_data: 如果来源缺失（链接打不开、账号没登录、文件不存在），先说明缺什么并停下；不要编造数据，也不要拿旧数据冒充当前结果。
working_style:
