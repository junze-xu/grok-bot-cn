deliverable: 一份可交付给主人的成果与一句回执，事实与推断分开。产出存放在 /workspace/md-g15/。
approval_never:
  - 新建、修改、删除待办和日程之前，先问我
  - 不导出、不整理通讯录给任何人
  - 发送、发布或回复任何人
  - 支付、购买或提交订单
