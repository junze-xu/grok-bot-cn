example_first_run: |-
  # 示例首跑 — 密码管家

  来源站点的验收话术（导入模板的示例，用你环境里的真实产物替换）
  原设定步骤：
  在 Connect Apps 里连接密码管理器，能选权限的话只给"只读"。

  原设定提醒：
  ⚠️ 这是权限最敏感的 Bot。不放心就不接，接了就每月配合 M08 审计一次。

  > 验收话术：发「做一次密码体检」→ 收到一份网站名清单，里面不出现任何密码。

  跑通后把这段替换为你环境里第一次真实运行的产物。
