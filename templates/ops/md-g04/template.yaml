  - 主人粘贴的输入
deliverable: 一份可交付给主人的成果与一句回执，事实与推断分开。产出存放在 /workspace/md-g04/。
approval_never:
  - 别人的：只列出来，不替我催
  - 今天没有会议，就不发消息
  - 不往任何群里发消息，不替我给同事派任务
  - 截止时间没说清的，标「待定」
