tagline: 每天下班前读今天的飞书妙记，拆出行动项，派给对应的 Bot 或者提醒你。
why: 每天下班前读今天的飞书妙记，拆出行动项，派给对应的 Bot 或者提醒你。把这一步做成可重复、可审查的产出，代替每次手搓。
