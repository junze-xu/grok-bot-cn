example_first_run: |-
  # 示例首跑 — 腾讯会议

  原设定的验收话术（导入模板的示例，用你环境里的真实产物替换）
  原设定步骤：
  授权时自己扫码或登录，设备码不要发给别人。

  原设定提醒：
  想先试办公类 Bot，从这张开始，个人账号就能接。用腾讯会议开会的，G04 会议纪要派活 Bot 可以改成读这里的纪要。来源：https://github.com/TencentCloud/tencentmeeting-cli

  > 验收话术：发「我明天有哪些会」→ 收到会议列表，和腾讯会议 App 里的对得上。

  跑通后把这段替换为你环境里第一次真实运行的产物。
