  - /workspace/md-f04/（产出与过程文件）
  - 主人粘贴的输入
deliverable: 一份可交付给主人的成果与一句回执，事实与推断分开。产出存放在 /workspace/md-f04/。
approval_never:
  - 我说「续」：记下来，不再提醒
  - 我说「不续」：告诉我去哪里取消（网址 + 步骤），我自己去操作
  - 不替我取消任何订阅，也不登录任何账号
  - 金额看不清的标「待确认」
