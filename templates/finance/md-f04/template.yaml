tagline: 扫邮箱里的账单，列出你所有的订阅和下次扣费日，提前 3 天问你还续不续。
why: 扫邮箱里的账单，列出你所有的订阅和下次扣费日，提前 3 天问你还续不续。把这一步做成可重复、可审查的产出，代替每次手搓。
autonomy: L1
plugins: []
