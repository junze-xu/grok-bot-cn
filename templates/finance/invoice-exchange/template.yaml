  | 日期 | 商品 | 金额 | 单号后四位 | 能否换开 |
  |---|---|---|---|---|
  | 10-03 | 显示器支架 | 189.00 | 4412 | 可以，个人抬头 |
  | 10-11 | 京东 E 卡 | 200.00 | 9088 | 排除：礼品卡 |
  | 10-18 | 外卖套餐 | 46.00 | 2201 | 排除：到家订单 |

  已停下。回复「确认」后才对 4412 申请换开。不会取消订单，也不会改收货地址。
share_safe: true
