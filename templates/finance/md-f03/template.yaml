  # 示例首跑 — 报销单

  来源站点的验收话术（导入模板的示例，用你环境里的真实产物替换）
  原设定步骤：
  第一次使用时发报销单模板给它。

  原设定提醒：
  提交前自己核对一遍合计金额。

  > 验收话术：发「做上个月的报销」→ 先收到清单，确认后收到压缩包。

  跑通后把这段替换为你环境里第一次真实运行的产物。
