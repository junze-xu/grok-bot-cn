example_first_run: |-
  # 示例首跑 — 狼人杀法官

  原设定的验收话术（导入模板的示例，用你环境里的真实产物替换）
  原设定步骤：
  无。单聊里玩就行，不用拉群。

  原设定提醒：
  一局大概几十轮对话，在单聊里玩比拉群省得多。Grok Bot 的群拉不了真人，所以没法和朋友一起开局；想和朋友玩，用它当"规则助手"，让它帮你算配置、记流程。原来参考的 werewolf-gamemaster 仓库**已经被删除了**，这张卡完全靠 Prompt 实现。

  > 验收话术：说「开一局」→ 收到 8 个 AI 玩家介绍和你自己的身份，第一个夜晚开始。

  跑通后把这段替换为你环境里第一次真实运行的产物。
