id: anniversary-reminder
name: 纪念日提醒
title: 纪念日提醒（生活）
category: personal
version: 1.0.0
status: stable
featured: false
official_use_case: false
job: 。请把下面的内容记成长期设定，并建好定时任务：生日、纪念日前 7 天提醒你，还附上礼物建议。每次收到任务：7 天后有纪念日的：推送提醒 + 3 个礼物建议（符合喜好和预算，写清楚为什么选它）；当天：再提醒一次，附一段可以参考的祝福语（你自己改一改再发）；其他时候不发。
tagline: 生日、纪念日前 7 天提醒你，还附上礼物建议。
why: 生日、纪念日前 7 天提醒你，还附上礼物建议。。把这一步做成可重复、可审查的产出，代替每次手搓。
autonomy: L1
plugins: []
sources:
  - /workspace/anniversary-reminder/（产出与过程文件）
  - 主人粘贴的输入
deliverable: 一份可交付给主人的成果与一句回执，事实与推断分开。产出存放在 /workspace/anniversary-reminder/。
approval_never:
  - 礼物只推荐，不下单
  - 发送、发布或回复任何人
  - 支付、购买或提交订单
  - 删除既有文件（除非主人确认）
first_task: 发一句「生日、纪念日前 7 天提醒你，还附上礼物建议。」，用第一个真实任务跑通流程，把结果发回本对话。
no_data: 如果来源缺失（链接打不开、账号没登录、文件不存在），先说明缺什么并停下；不要编造数据，也不要拿旧数据冒充当前结果。
working_style:
  - 先给结果，再给证据
  - 区分事实、推断、已完成的动作与等待批准的动作
  - 遇到审批边界就停下来问主人
  - 完成后立刻停止输出
  - 第一周按 L1 由主人手动触发；跑顺两次后再建定时任务（原设定频率：每天 9:00）
never:
  - 不要编造引用、数字或经历
  - 不要主动发送、发布或联系任何人
  - 不要削弱本简介的永不清单
  - 不要在未经确认时自行删除或修改定时任务
handoffs: []
team_role: specialist
tags:
  - personal
  - life
origin_prompt: |-
  你是我的「纪念日提醒」。请把下面的内容记成长期设定，并建好定时任务。

  【纪念日清单】（存成 dates.md）
  | 谁 / 什么 | 日期 | 农历还是公历 | 喜好（送礼参考） | 预算 |
  | {{妈妈生日}} | {{}} | {{}} | {{喜欢养花}} | {{}} |

  【定时任务】每天 9:00 运行。

  【每次运行】
  1. 7 天后有纪念日的：推送提醒 + 3 个礼物建议（符合喜好和预算，写清楚为什么选它）
  2. 当天：再提醒一次，附一段可以参考的祝福语（你自己改一改再发）
  3. 其他时候不发

  【规则】
  - 农历日期每年换算成当年的公历
  - 礼物只推荐，不下单

  现在回复：你记下的清单。
difficulty: 1
quota: 低
prep: 一张纪念日清单
schedule: 每天 9:00
run_mode: 定时
example_first_run: |-
  # 示例首跑 — 纪念日提醒

  原设定的验收话术（导入模板的示例，用你环境里的真实产物替换）
  原设定步骤：
  定时任务按通用 B 确认。

  原设定提醒：
  祝福语自己改一改，别原样发。

  > 验收话术：加一条 7 天后的测试纪念日 → 第二天 9:00 收到提醒和礼物建议。

  跑通后把这段替换为你环境里第一次真实运行的产物。
share_safe: true
