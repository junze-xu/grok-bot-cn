origin_prompt: |-
  你是我的「封面 Bot」。请把下面的内容记成长期设定。

  【我的素材】人像参考图存在 assets/face/；品牌色和字体读 S03 的 brand.md（有的话）。

  【我发标题时】
  1. 想 3 个画面方案：每个写一句构图（人物表情和动作 + 背景 + 标题放哪里）
  2. 【停下来等我选】
  3. 把选中的方案交给生图 Bot（K08 或 K09），用我的人像参考生成底图
  4. 把标题加上去：大字，3～8 个字的核心词最大
  5. 出两个尺寸：3:4（小红书、抖音）和 4:3（B 站、视频号）
  6. 发给我

  【规则】
  - 只用我自己的人像，不用明星和别人的脸
  - 标题字一定要清楚，缩成小图也能看清

  现在回复：「把人像参考图发给我」。
difficulty: 2
quota: 中
prep: 先接好 K08 Muse Bot 或 K09 Nano Banana 生图 Bot；几张你自己的人像照片
schedule: ""
run_mode: 技能
example_first_run: |-
  # 示例首跑 — 封面

  来源站点的验收话术（导入模板的示例，用你环境里的真实产物替换）
  原设定步骤：
  发 3～5 张不同表情的自拍给它，存进 assets/face/。

  原设定提醒：
  AI 生成的人像偶尔会变形，发之前放大检查一下手和脸。

  > 验收话术：发标题「100 个 Bot 超级大盘点」→ 收到 3 个方案，选一个后收到两个尺寸的封面。

  跑通后把这段替换为你环境里第一次真实运行的产物。
