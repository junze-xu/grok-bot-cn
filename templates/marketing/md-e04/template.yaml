  来源站点的验收话术（导入模板的示例，用你环境里的真实产物替换）
  原设定步骤：
  第一次使用时把常见问题整理好发给它。

  原设定提醒：
  配方参考 sit-in/awesome-grokbot-playbooks · outbound-support。

  > 验收话术：转一条"这个衣服会起球吗？"→ 收到分类和回复草稿。

  跑通后把这段替换为你环境里第一次真实运行的产物。
