tagline: 每天盯着竞品的价格、上新、页面变化，只报真正有意义的变化，不给你刷屏。
why: 每天盯着竞品的价格、上新、页面变化，只报真正有意义的变化，不给你刷屏。把这一步做成可重复、可审查的产出，代替每次手搓。
