  # 示例首跑 — 选品比价

  来源站点的验收话术（导入模板的示例，用你环境里的真实产物替换）
  原设定步骤：
  做跨境的，在 Connect Apps 里连接 Amazon。

  原设定提醒：
  有平台拦截过 AI 代理下单，这个 Bot 只查不买。

  > 验收话术：发「查一下便携榨汁杯」→ 收到比价表和评论分析。

  跑通后把这段替换为你环境里第一次真实运行的产物。
