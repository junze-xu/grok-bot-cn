id: group-for-visible-handoffs
name: 用群组让交接可见
summary: >
  多个 Bot 需要同一个共享结果和可见交接时，用群组。
  两到六个 Bot，每个阶段一个负责人，靠 @ 点名。
rule: >
  启动消息写清结果、下一步负责人和 never 清单。避免 @everyone；
  太多并行交接会重复劳动。
anti_pattern: 五个 Bot 挤在私聊地狱里没有群组，或一个 Bot 假装是五个。
source: https://docs.x.ai/grok-bot/chat-and-collaboration
applies_to:
  - teams
