id: skill-six-fields
name: 技能六字段
summary: >
  一个有用的技能要写清：何时用、要什么输入、步骤是什么、如何验证、
  返回什么、以及什么需要批准。
rule: >
  跑成功一次之后才存技能。如果技能没出现在 / 里，就到
  Settings → Plugins → Yours 下按 Bot 逐个启用。
anti_pattern: 一段只有氛围、没有验证与审批字段的技能。
source: https://docs.x.ai/grok-bot/skills-routines-and-automations
applies_to:
  - skills
